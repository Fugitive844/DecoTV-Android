plugins { id 'com.android.application' }
// 以下均由打包命令注入：服务器留空时由用户在登录页填写，升级服务留空时不检查更新
def defaultServer = (project.findProperty('appDefaultServer') ?: '').toString()
def updateOrigin = (project.findProperty('appUpdateOrigin') ?: '').toString()
def updateChannel = (project.findProperty('appUpdateChannel') ?: '').toString()
if (updateOrigin && !(updateOrigin ==~ /^https:\/\/[A-Za-z0-9.-]+$/)) throw new GradleException('appUpdateOrigin must be a plain HTTPS origin')
def applicationIdValue = (project.findProperty('appApplicationId') ?: 'io.github.fugitive844.decotv').toString()
def developer = (project.findProperty('appDeveloper') ?: 'DecoTV Android 贡献者').toString()
def copyrightOwner = (project.findProperty('appCopyrightOwner') ?: 'DecoTV Android 贡献者').toString()
def quoted = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'io.github.fugitive844.decotv'
    compileSdk 35
    defaultConfig {
        applicationId applicationIdValue
        minSdk 26
        targetSdk 35
        versionCode = (project.findProperty('appVersionCode') ?: '1').toInteger()
        versionName = (project.findProperty('appVersionName') ?: '1.0.0')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'DEFAULT_SERVER', quoted(defaultServer)
        buildConfigField 'String', 'UPDATE_ORIGIN', quoted(updateOrigin)
        buildConfigField 'String', 'UPDATE_CHANNEL', quoted(updateChannel)
        buildConfigField 'String', 'DEVELOPER', quoted(developer)
        buildConfigField 'String', 'COPYRIGHT_OWNER', quoted(copyrightOwner)
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        delivery {
            if (System.getenv('DECOTV_SIGN_STORE')) storeFile file(System.getenv('DECOTV_SIGN_STORE'))
            storePassword System.getenv('DECOTV_SIGN_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('DECOTV_SIGN_ALIAS') ?: ''
            keyPassword System.getenv('DECOTV_SIGN_KEY_PASSWORD') ?: ''
            enableV3Signing = true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('DECOTV_SIGN_STORE')) signingConfig signingConfigs.delivery
        }
    }
    testOptions { animationsDisabled = true }
    lint { abortOnError true }
}
dependencies {
    def media3 = '1.4.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    // 离线缓存转 MP4：编码兼容时只换封装，否则转码
    implementation "androidx.media3:media3-transformer:$media3"
    implementation "androidx.media3:media3-muxer:$media3"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
